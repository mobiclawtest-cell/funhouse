<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Memory Grid — Funhouse</title>
<link rel='stylesheet' href='../../style.css'>
<style>
  #grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:400px;margin:0 auto}
  .tile{
    aspect-ratio:1;border:1px solid var(--line);border-radius:14px;background:var(--card);
    padding:0;cursor:pointer;transition:background .1s ease,transform .08s ease;touch-action:manipulation;
  }
  .tile.on{background:#8ff3f5;transform:scale(.95);border-color:#8ff3f5}
</style>
</head>
<body class='game'>
<div class='wrap'>
  <a class='back' href='../../'>&larr; Funhouse</a>
  <h1>Memory Grid</h1>
  <p class='sub'>Watch the pattern light up, then repeat it.</p>

  <div id='grid'></div>

  <p class='stat' id='msg'>Get ready...</p>
  <p class='stat'>Level: <b id='level'>0</b> &middot; Best: <b id='best'>&mdash;</b></p>
</div>
<script src='game.js'></script>
</body>
</html>
