<!DOCTYPE html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Whack-a-Mole — Funhouse</title>
<link rel='stylesheet' href='../../style.css'>
<style>
  #grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:420px;margin:0 auto}
  .hole{
    aspect-ratio:1;border-radius:50%;border:1px solid var(--line);background:var(--card);
    display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;
    font-size:clamp(26px,8vw,44px);transition:transform .08s ease,background .1s ease;touch-action:manipulation;
  }
  .hole.up{background:#2b3a2f;transform:scale(1.05)}
  .hole.up::after{content:'\1F439'}
</style>
</head>
<body class='game'>
<div class='wrap'>
  <a class='back' href='../../'>&larr; Funhouse</a>
  <h1>Whack-a-Mole</h1>
  <p class='sub'>Bonk them before they duck back down. 30 seconds.</p>

  <div id='grid'></div>

  <p class='stat'>Score: <b id='score'>0</b> &middot; Time: <b id='time'>30.0</b>s &middot; Best: <b id='best'>&mdash;</b></p>
  <p class='stat' id='msg'>Tap any hole to start.</p>
</div>
<script src='game.js'></script>
</body>
</html>
